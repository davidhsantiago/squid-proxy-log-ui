# Minimal Squid configuration for local proxy testing.
# This is intentionally simple so the log UI can verify that requests are passing through Squid.

http_port 3128
cache deny all

# Logging locations for the app to read from.
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache_store_log /var/log/squid/store.log
pid_filename /var/run/squid.pid
coredump_dir /var/spool/squid

# Allow loopback and local traffic for the app and the test request.
acl localnet src 127.0.0.1/32 ::1
acl all src all

http_access allow localnet
http_access allow all
http_access deny all

# Keep the process single-threaded and easy to debug in Docker.
workers 1
