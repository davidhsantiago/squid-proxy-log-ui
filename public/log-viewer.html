<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" href="/assets/css/main.css">
	<title>Log Viewer | Squid Proxy Log UI</title>
</head>
<body>
	<nav class="main-nav" aria-label="Main Navigation">
		<a class="brand" href="/">
			<span class="brand-icon" aria-hidden="true"><i class="bi bi-hdd-network-fill"></i></span>
			<span class="brand-text">Squid Proxy Log UI</span>
		</a>

		<ul class="nav-links">
			<li><a class="nav-link" href="/"><i class="bi bi-house-fill"></i> Home</a></li>
			<li><a class="nav-link active" href="/log-viewer.html"><i class="bi bi-file-earmark-text-fill"></i> Logs</a></li>
		</ul>

		<div class="status-pill" id="service-status-badge" role="status" aria-live="polite">
			<span class="status-label">Squid</span>
			<span id="service-status" class="status-value">Checking...</span>
			<span id="service-status-dot" class="status-dot" aria-hidden="true"></span>
		</div>
	</nav>

	<main class="main-content" aria-label="Log Viewer Content">
		<section class="hero-panel viewer-hero">
			<p class="hero-kicker">Traffic Timeline</p>
			<h1 class="hero-title">Log Viewer</h1>
			<p class="hero-text">Browse log pages from the Squid API endpoint and refresh on demand.</p>
		</section>

		<section class="content-card viewer-shell" aria-label="Logs Table">
			<div class="viewer-toolbar">
				<label class="viewer-label" for="log-file-select">Log file</label>
				<select id="log-file-select" class="viewer-select"></select>

				<label class="viewer-label" for="limit-select">Rows per page</label>
				<select id="limit-select" class="viewer-select">
					<option value="25">25</option>
					<option value="50" selected>50</option>
					<option value="100">100</option>
				</select>
				<button id="refresh-button" class="viewer-button" type="button">
					<i class="bi bi-arrow-repeat" aria-hidden="true"></i> Refresh
				</button>
				<div id="download-input">
					<div>
						<label for="">Lines</label>
					</div>

					<input type="number" placeholder="100">
					<button id="confirm-download-button" class="viewer-button" type="button">
						<i class="bi bi-file-earmark-arrow-down"></i>
					</button>
				</div>
				<button id="download-button" class="viewer-button" type="button">
					<i class="bi bi-file-earmark-arrow-down"></i> Download
				</button>
			</div>

			<div class="viewer-meta">
				<span id="viewer-status">Ready.</span>
				<span id="viewer-pagination">Page 1</span>
			</div>

			<div class="viewer-table-wrap">
				<table class="viewer-table" aria-label="Squid Logs">
					<thead>
						<tr>
							<th scope="col">#</th>
							<th scope="col">Source</th>
							<th scope="col">Entry</th>
						</tr>
					</thead>
					<tbody id="logs-table-body">
						<tr>
							<td colspan="3">No logs loaded yet.</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="viewer-pager">
				<button id="prev-page" class="viewer-button" type="button">Previous</button>
				<button id="next-page" class="viewer-button" type="button">Next</button>
			</div>
		</section>
	</main>

	<script src="/assets/js/getSystemdStatus.js" defer></script>
	<script src="/assets/js/logViewer.js" defer></script>
</body>
</html>
